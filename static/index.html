<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b3bd6">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>WalletWatch</title>
<style>
:root {
  --bg: #edf1f6; --surface: #f9fbfd; --ink: #16223a; --muted: #56657f; --line: #d3dbe7;
  --accent: #3b3bd6; --accent-ink: #ffffff; --good: #0b7a63; --warn: #a24a05; --bad: #b42318; --wash: #e3e8f2;
  --font: "Avenir Next", "Segoe UI Variable", "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1626; --surface: #151e33; --ink: #e6ebf5; --muted: #9aa8c2; --line: #27334f;
    --accent: #8f8fff; --accent-ink: #0f1626; --good: #4fd1b0; --warn: #f2b85b; --bad: #ff8a80; --wash: #1c2842;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); }
body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); -webkit-text-size-adjust: 100%; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
main { max-width: 640px; margin: 0 auto; }
header.top { display: flex; align-items: center; gap: 10px; padding: calc(14px + env(safe-area-inset-top)) 18px 6px; }
header.top h1 { font-size: 18px; font-weight: 650; margin: 0; letter-spacing: .1px; flex: 1; }
.live { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--good); }
.demo { margin: 6px 18px 0; padding: 8px 12px; background: var(--wash); border-left: 4px solid var(--warn); font-size: 14px; }
section.tab { display: none; padding: 8px 18px 24px; }
section.tab.active { display: block; }
h2 { font-size: 26px; line-height: 1.2; font-weight: 700; margin: 14px 0 6px; letter-spacing: -.2px; }
h3 { font-size: 16px; font-weight: 650; margin: 26px 0 8px; }
p.lead { margin: 0 0 14px; color: var(--muted); max-width: 46ch; }
.rules { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 8px; font-size: 15px; color: var(--muted); }
select, input[type=text] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-height: 44px; }
input[type=text] { width: 100%; }
.sig { display: grid; grid-template-columns: 78px 1fr auto; gap: 4px 12px; padding: 16px 0; border-top: 1px solid var(--line); }
.sig:last-of-type { border-bottom: 1px solid var(--line); }
.sig svg { grid-column: 1; grid-row: 1 / 3; align-self: center; }
.sig .nm { grid-column: 2; grid-row: 1; align-self: end; }
.sym { font-size: 20px; font-weight: 700; }
.chain { font-size: 13px; color: var(--muted); margin-left: 6px; font-weight: 500; }
.who { grid-column: 2; grid-row: 2; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.score { grid-column: 3; text-align: right; grid-row: 1 / 3; align-self: center; }
.score b { display: block; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.score span { font-size: 13px; font-weight: 600; }
.r-Strong { color: var(--good); } .r-Moderate { color: var(--accent); } .r-Weak { color: var(--warn); }
.detail { grid-column: 1 / -1; margin-top: 8px; }
dl.m { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 10px; }
dl.m div { background: var(--wash); padding: 8px 10px; border-radius: 8px; }
dl.m dt { font-size: 12px; color: var(--muted); } dl.m dd { margin: 0; font-weight: 650; font-variant-numeric: tabular-nums; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.flag { border-left: 3px solid var(--warn); padding: 4px 10px; margin: 6px 0; font-size: 14px; }
.flag.info { border-color: var(--muted); }
details summary { cursor: pointer; font-size: 14px; color: var(--accent); padding: 6px 0; min-height: 32px; }
a { color: var(--accent); }
p.s { font-size: 14px; color: var(--muted); margin: 4px 0 10px; }
.fine { font-size: 13px; color: var(--muted); margin-top: 18px; max-width: 52ch; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.row:last-child { border-bottom: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 650; overflow-wrap: anywhere; } .row .s { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row .err { color: var(--bad); }
.amt { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); text-align: right; }
button.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 650; min-height: 46px; cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
button.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); padding: 8px 12px; min-height: 40px; }
button.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
form.add { display: grid; gap: 10px; margin: 8px 0 4px; }
label { font-size: 14px; color: var(--muted); display: grid; gap: 4px; }
.empty { padding: 22px 0; color: var(--muted); }
nav.bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav.bar button { flex: 1; background: none; border: 0; padding: 14px 4px 12px; font-weight: 600; color: var(--muted); min-height: 56px; border-top: 3px solid transparent; cursor: pointer; }
nav.bar button[aria-selected=true] { color: var(--accent); border-top-color: var(--accent); }
.toast { position: fixed; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top)); max-width: 616px; margin: 0 auto; background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 10px; z-index: 9; }
.toast b { display: block; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: drop .25s ease-out; } @keyframes drop { from { transform: translateY(-20px); opacity: 0; } } }
.coinrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.coinrow:last-of-type { border-bottom: 1px solid var(--line); }
.coinrow .sym { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
button.btn.sm { padding: 8px 16px; min-height: 40px; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--good); color: #fff; margin-left: 8px; vertical-align: middle; }
dialog#sigdlg { border: 1px solid var(--line); border-radius: 16px; padding: 22px; width: min(92vw, 460px); max-height: 86vh; overflow: auto; background: var(--surface); color: var(--ink); }
dialog#sigdlg::backdrop { background: rgba(10, 16, 30, .55); }
dialog#sigdlg h2 { margin: 0 0 4px; overflow-wrap: anywhere; }
dialog#sigdlg .wl { margin: 10px 0; padding-left: 18px; }
dialog#sigdlg .actions { display: flex; justify-content: flex-end; margin-top: 16px; }
.usage { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 0 0 16px; background: var(--surface); }
.usage progress { width: 100%; height: 12px; margin: 8px 0; accent-color: var(--accent); }
.addr { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.addr code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.addr.full code { font-size: 12.5px; word-break: break-all; }
button.copy { min-height: 36px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
button.copy:hover { background: var(--bg); }
.noname { color: var(--muted); font-weight: 500; font-style: italic; }
</style>
</head>
<body>
<header class="top">
  <h1>WalletWatch</h1>
  <div class="live" aria-live="polite"><span class="dot" id="dot"></span><span id="livetxt">Connecting</span></div>
</header>
<div class="demo" id="demo" hidden>Demo mode. Everything below is simulated. Run without MOCK=1 to watch real wallets.</div>
<main>
  <section class="tab active" id="tab-signals" role="tabpanel"></section>
  <section class="tab" id="tab-graph" role="tabpanel"></section>
  <section class="tab" id="tab-activity" role="tabpanel"></section>
  <section class="tab" id="tab-allbuys" role="tabpanel"></section>
  <section class="tab" id="tab-wallets" role="tabpanel"></section>
</main>
<nav class="bar" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="signals" aria-selected="true">Signals</button>
  <button role="tab" data-tab="graph" aria-selected="false">Graph</button>
  <button role="tab" data-tab="activity" aria-selected="false">Activity</button>
  <button role="tab" data-tab="allbuys" aria-selected="false">All Buys</button>
  <button role="tab" data-tab="wallets" aria-selected="false">Wallets</button>
</nav>
<script src="/app.js"></script>
<dialog id="sigdlg" aria-labelledby="sigtitle"><div id="sigbody"></div></dialog>
</body>
</html>
