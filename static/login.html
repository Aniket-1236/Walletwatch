<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b3bd6">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/icon-192.png">
<title>WalletWatch - Login</title>
<style>
:root { --bg: #edf1f6; --surface: #f9fbfd; --ink: #16223a; --muted: #56657f; --line: #c3cde0; --accent: #3b3bd6; --accent-ink: #fff; --bad: #b42318;
  --font: "Avenir Next", "Segoe UI Variable", "Segoe UI", Roboto, system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1626; --surface: #151e33; --ink: #e6ebf5; --muted: #9aa8c2; --line: #33415f; --accent: #8f8fff; --accent-ink: #0f1626; --bad: #ff8a80; } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); }
main { max-width: 380px; margin: 0 auto; padding: 14vh 20px 40px; }
h1 { font-size: 22px; margin: 0 0 4px; }
p.lead { color: var(--muted); margin: 0 0 22px; }
form { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
label { display: block; font-size: 14px; font-weight: 600; margin: 0 0 6px; }
input { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; margin-bottom: 14px; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button { width: 100%; min-height: 48px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; cursor: pointer; }
button[disabled] { opacity: .6; cursor: wait; }
#msg { min-height: 1.4em; margin: 12px 0 0; color: var(--bad); font-size: 14px; }
.fine { color: var(--muted); font-size: 13px; text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>WalletWatch</h1>
  <p class="lead">Private panel. Enter your password to continue.</p>
  <form id="f" autocomplete="on">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus maxlength="200">
    <div id="codebox" hidden>
      <label for="code">Authenticator code</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" placeholder="6 digits">
    </div>
    <button id="go" type="submit">Log in</button>
    <p id="msg" role="alert" aria-live="assertive"></p>
  </form>
  <p class="fine">Your password is checked on the server only.</p>
</main>
<script src="/login.js"></script>
</body>
</html>
